version: '3.8'

services:
  # 1. 스트림릿 앱 서비스
  app:
    build: .
    container_name: car-rag-app
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434   # ⭐ 이 주소로 Ollama 컨테이너와 통신
    depends_on:
      - ollama
    restart: always

  # 2. Ollama 서비스
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  ollama_data: