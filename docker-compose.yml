version: '3.8'

services:
  # 1. FastAPI 백엔드 앱 서비스
  app:
    build: .
    container_name: car-rag-app
    ports:
      - "8000:8000"  # ⭐ 8501을 8000으로 변경!
    environment:
      - OLLAMA_HOST=http://ollama:11434   # Ollama 컨테이너와 통신
    depends_on:
      - ollama
    restart: always

  # 2. Ollama 서비스
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  ollama_data: